<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan Dashboard — Full Bloom</title>
<!--
  Password-gated dashboard. Reads scans from your Google Sheet via the
  Apps Script GET endpoint. The password is checked server-side by the
  Apps Script (see DASHBOARD_PASSWORD in Code.gs) — this page just passes
  it along. Set API_URL below.
-->
<style>
  :root{
    --cream:#FBF8F2;--bark:#3A2E24;--petal:#C86E12;--amber:#EFA92B;
    --sage:#7A9B8A;--line:#E7DDCB;--muted:#8a7d6d;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:var(--cream);color:var(--bark);}
  header{padding:22px 26px;border-bottom:1px solid var(--line);display:flex;
         align-items:baseline;gap:14px;flex-wrap:wrap}
  header h1{font-size:19px;margin:0;letter-spacing:.02em}
  header .sub{color:var(--muted);font-size:13px}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 26px}
  /* login */
  .login{max-width:340px;margin:70px auto;padding:28px;background:#fff;
         border:1px solid var(--line);border-radius:14px;text-align:center}
  .login .bloom{font-size:12px;letter-spacing:.2em;text-transform:uppercase;
                color:var(--petal);margin-bottom:16px}
  .login input{width:100%;padding:11px 12px;border:1px solid var(--line);
               border-radius:9px;font-size:15px;margin-bottom:12px}
  .login button,.bar button{background:var(--petal);color:#fff;border:0;
    padding:11px 18px;border-radius:9px;font-size:14px;cursor:pointer}
  .login .err{color:#b23b3b;font-size:13px;min-height:18px}
  /* stats */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
         gap:14px;margin-bottom:22px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .stat .n{font-size:26px;font-weight:600}
  .stat .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
  .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:12px}
  .bar .status{font-size:13px;color:var(--muted)}
  /* table */
  .tblwrap{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:auto}
  table{border-collapse:collapse;width:100%;font-size:13px;min-width:760px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{background:#F4EEE3;color:#6b5d4f;font-weight:600;position:sticky;top:0}
  tr:last-child td{border-bottom:0}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
  .ios{background:#e7f0ff;color:#2c5aa0}.android{background:#e6f6ea;color:#2f7d43}
  .desktop{background:#f0ece4;color:#6b5d4f}
  .hide{display:none}
  .del{background:transparent;border:1px solid #d9b3b3;color:#b23b3b;
       padding:5px 10px;border-radius:7px;font-size:12px;cursor:pointer}
  .del:hover{background:#b23b3b;color:#fff}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="login">
  <div class="bloom">Full Bloom Counseling</div>
  <div style="font-size:15px;margin-bottom:16px">Scan Dashboard</div>
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <div class="err" id="err"></div>
  <button onclick="login()">View scans</button>
</div>

<!-- DASHBOARD -->
<div id="app" class="hide">
  <header>
    <h1>Scan Dashboard</h1>
    <span class="sub">Full Bloom Counseling — business card QR</span>
  </header>
  <div class="wrap">
    <div class="stats" id="stats"></div>
    <div class="bar">
      <div class="status" id="status">Loading…</div>
      <div>
        <button onclick="clearAll()" style="background:#b23b3b;margin-right:8px">Clear all scans</button>
        <button onclick="load()">Refresh</button>
      </div>
    </div>
    <div class="tblwrap">
      <table id="tbl">
        <thead><tr>
          <th>When</th><th>Device</th><th>OS</th><th>Browser</th>
          <th>City</th><th>Region</th><th>Country</th><th>Loc</th><th></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
// ========================= CONFIG =========================
var API_URL = "https://script.google.com/macros/s/AKfycbz_Nt3ReDB22yhyn29w4_WpJzNfGU2zbYXIhNwZDfEOVc7jwn7wLdDdFE-qLcz9qRpl/exec";
var AUTO_REFRESH_MS = 30000;   // near real-time: re-poll every 30s
// ==========================================================

var PW = "";

function login(){
  PW = document.getElementById("pw").value.trim();
  if(!PW){document.getElementById("err").textContent="Enter the password.";return;}
  document.getElementById("err").textContent="";
  load(true);
}

function esc(s){return String(s==null?"":s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function devicePill(os){
  var c = os==="iOS"?"ios":(os==="Android"?"android":"desktop");
  return '<span class="pill '+c+'">'+esc(os||"—")+'</span>';
}

function render(scans){
  // stats
  var total=scans.length;
  var today=0, ios=0, android=0, cities={};
  var t0=new Date();t0.setHours(0,0,0,0);
  scans.forEach(function(s){
    var iso=s["ISO Time"];
    if(iso && new Date(iso)>=t0) today++;
    if(s["OS"]==="iOS")ios++; if(s["OS"]==="Android")android++;
    var c=s["City"]; if(c)cities[c]=(cities[c]||0)+1;
  });
  var topCity="—",topN=0;
  Object.keys(cities).forEach(function(c){if(cities[c]>topN){topN=cities[c];topCity=c;}});
  var st=document.getElementById("stats");
  st.innerHTML=
    stat(total,"Total scans")+
    stat(today,"Today")+
    stat(ios+"/"+android,"iOS / Android")+
    stat(topCity,"Top city");

  // rows
  var html="";
  scans.forEach(function(s){
    var iso = s["ISO Time"];
    html+="<tr>"+
      "<td>"+esc(s["Timestamp (local)"])+"</td>"+
      "<td>"+esc(s["Device"])+"</td>"+
      "<td>"+devicePill(s["OS"])+"</td>"+
      "<td>"+esc(s["Browser"])+"</td>"+
      "<td>"+esc(s["City"])+"</td>"+
      "<td>"+esc(s["Region"])+"</td>"+
      "<td>"+esc(s["Country"])+"</td>"+
      "<td>"+esc(s["Loc Source"])+"</td>"+
      "<td><button class='del' onclick=\"delScan('"+esc(iso)+"')\">Delete</button></td>"+
    "</tr>";
  });
  document.getElementById("rows").innerHTML =
    html || '<tr><td colspan="9" style="color:#8a7d6d">No scans yet.</td></tr>';
}

function stat(n,l){return '<div class="stat"><div class="n">'+esc(n)+
  '</div><div class="l">'+esc(l)+'</div></div>';}

function load(first){
  if(API_URL.indexOf("PASTE_")===0){
    document.getElementById("err").textContent="API_URL not set yet.";
    return;
  }
  document.getElementById("status").textContent="Loading…";
  fetch(API_URL+"?pw="+encodeURIComponent(PW))
    .then(function(r){return r.json();})
    .then(function(j){
      if(!j.ok){
        if(first){document.getElementById("err").textContent=
          j.error==="unauthorized"?"Wrong password.":"Error loading.";}
        return;
      }
      // success — reveal app on first load
      document.getElementById("login").classList.add("hide");
      document.getElementById("app").classList.remove("hide");
      render(j.scans||[]);
      document.getElementById("status").textContent=
        "Updated "+new Date().toLocaleTimeString()+" · "+(j.count||0)+" scans";
    })
    .catch(function(){
      document.getElementById("status").textContent="Network error — will retry.";
    });
}

// delete a single scan by its ISO time, then refresh
function delScan(iso){
  if(!confirm("Delete this scan?")) return;
  document.getElementById("status").textContent="Deleting…";
  fetch(API_URL+"?pw="+encodeURIComponent(PW)+"&action=delete&iso="+encodeURIComponent(iso))
    .then(function(r){return r.json();})
    .then(function(){ load(false); })
    .catch(function(){ document.getElementById("status").textContent="Delete failed."; });
}

// wipe all scans (for clearing test data)
function clearAll(){
  if(!confirm("Delete ALL scans? This cannot be undone.")) return;
  if(!confirm("Really clear everything and start fresh?")) return;
  document.getElementById("status").textContent="Clearing…";
  fetch(API_URL+"?pw="+encodeURIComponent(PW)+"&action=clear")
    .then(function(r){return r.json();})
    .then(function(){ load(false); })
    .catch(function(){ document.getElementById("status").textContent="Clear failed."; });
}

// enter key submits
document.getElementById("pw").addEventListener("keydown",function(e){
  if(e.key==="Enter")login();
});
// auto-refresh once logged in
setInterval(function(){
  if(!document.getElementById("app").classList.contains("hide")) load(false);
}, AUTO_REFRESH_MS);
</script>
</body>
</html>
